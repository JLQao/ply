<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌊 صائد الأسماك - نظام الحظ الصعب 20%</title>
    <style>
        :root {
            --gold: #ffd700;
            --border-color: rgba(255, 215, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #01060d;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            width: 100%;
            max-width: 950px;
            background: rgba(10, 22, 40, 0.95);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 14px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(0, 150, 255, 0.2);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 18px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .title {
            font-size: 20px;
            font-weight: 900;
            background: linear-gradient(180deg, #ffffff 20%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .balance-box {
            background: linear-gradient(135deg, #111, #222);
            border: 1px solid var(--gold);
            border-radius: 12px;
            padding: 6px 16px;
            font-size: 17px;
            font-weight: 900;
            color: var(--gold);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }

        .stage-wrapper {
            position: relative;
            width: 100%;
            height: 460px;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
            cursor: crosshair;
            box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.8);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .bullet-options {
            display: flex;
            gap: 12px;
        }

        .bullet-btn {
            background: linear-gradient(180deg, #1e293b, #0f172a);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 12px;
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .bullet-btn.active {
            border-color: var(--gold);
            background: linear-gradient(180deg, #3a2d0c, #1a1303);
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
            transform: translateY(-2px);
        }

        .bullet-btn span { color: var(--gold); font-size: 15px; }
        .bullet-btn small { font-size: 10px; color: #aaa; margin-top: 2px; }
    </style>
</head>
<body>

<div class="game-container">
    <div class="hud-header">
        <div class="title">🌊 صيد الأسماك (نسبة حظ 20% ومخاطرة عالية)</div>
        <div class="balance-box">💰 الرصيد: <span id="balanceText" data-game-balance>0</span> ريال</div>
    </div>

    <div class="stage-wrapper" id="stageWrapper">
        <canvas id="gameCanvas" width="950" height="460"></canvas>
    </div>

    <div class="controls-bar">
        <div style="font-size: 13px; color: #ff4d4d; font-weight: bold;">⚠️ انتبه: نسبة صيد الحظ 20% واحتتمال الخسارة 60%!</div>
        <div class="bullet-options">
            <button class="bullet-btn active" onclick="selectBullet(10, this)">
                <span>💥 10 ريال</span>
                <small>حظ عادي (1x)</small>
            </button>
            <button class="bullet-btn" onclick="selectBullet(20, this)">
                <span>⚡ 20 ريال</span>
                <small>رفع الحظ (1.5x)</small>
            </button>
            <button class="bullet-btn" onclick="selectBullet(50, this)">
                <span>🔥 50 ريال</span>
                <small>رفع الحظ (2.2x)</small>
            </button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script src="../js/game-bridge.js"></script><script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let balance = 0;
    let selectedPrice = 10;
    let cannonAngle = -Math.PI / 2;
    let cannonRecoil = 0;

    const cannon = {
        x: canvas.width / 2,
        y: canvas.height - 15
    };

    let bullets = [];
    let fishes = [];
    let particles = [];
    let bubbles = [];
    let floatingTexts = [];

    // فقاعات الخلفية
    for (let i = 0; i < 25; i++) {
        bubbles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            radius: Math.random() * 3 + 1,
            speed: Math.random() * 1 + 0.5,
            swing: Math.random() * 0.05
        });
    }

    // قوالب الأسماك (تم ضبط نسبة الحظ الأساسية إلى 20% فقط)
    const fishTemplates = [
        { type: 'small', isLuckBased: true, baseKillChance: 0.20, reward: 35, width: 38, height: 20, mainColor: '#ff9f43', stripeColor: '#ffffff' },
        { type: 'medium', isLuckBased: true, baseKillChance: 0.12, reward: 90, width: 55, height: 28, mainColor: '#54a0ff', stripeColor: '#2e86de' },
        { type: 'large', isLuckBased: false, hp: 160, maxHp: 160, reward: 400, width: 95, height: 45, mainColor: '#8395a7', stripeColor: '#576574' }
    ];

    let audioCtx = null;

    // صوت "بيو بيو" (Pew Pew)
    function playPewSound(price) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            let startFreq = 950 + price * 8;
            let endFreq = 160;

            osc.type = 'sine';
            osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime + 0.14);

            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.14);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.14);
        } catch(e){}
    }

    function playKillSound() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(450, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(850, audioCtx.currentTime + 0.22);

            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.22);
        } catch(e){}
    }

    function selectBullet(price, btn) {
        selectedPrice = price;
        document.querySelectorAll('.bullet-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function getCanvasCoordinates(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        let clientX = e.clientX;
        let clientY = e.clientY;

        if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        }

        return {
            x: (clientX - rect.left) * scaleX,
            y: (clientY - rect.top) * scaleY
        };
    }

    function handlePointerDown(e) {
        const pos = getCanvasCoordinates(e);
        cannonAngle = Math.atan2(pos.y - cannon.y, pos.x - cannon.x);
        shoot();
    }

    canvas.addEventListener('mousedown', handlePointerDown);
    canvas.addEventListener('touchstart', (e) => {
        handlePointerDown(e);
        e.preventDefault();
    }, { passive: false });

    async function shoot() {
        if (balance < selectedPrice) {
            alert('انتهى رصيدك! أعد تحميل الصفحة للبدء من جديد.');
            return;
        }

        const remaining = await gameBridge.debit('fishing', selectedPrice);
        if (remaining === null) return;
        balance = remaining;
        document.getElementById('balanceText').innerText = balance;
        cannonRecoil = 12;

        let speed = 11;
        let radius = 5;
        let color = '#ffd700';

        if (selectedPrice === 20) {
            radius = 8;
            color = '#ff9f43';
            speed = 13;
        } else if (selectedPrice === 50) {
            radius = 13;
            color = '#ff4d4d';
            speed = 15;
        }

        playPewSound(selectedPrice);

        bullets.push({
            x: cannon.x + Math.cos(cannonAngle) * 45,
            y: cannon.y + Math.sin(cannonAngle) * 45,
            vx: Math.cos(cannonAngle) * speed,
            vy: Math.sin(cannonAngle) * speed,
            radius: radius,
            color: color,
            price: selectedPrice
        });
    }

    function spawnFish() {
        if (fishes.length < 9 && Math.random() < 0.035) {
            const rand = Math.random();
            let template = fishTemplates[0];
            if (rand > 0.45 && rand < 0.82) template = fishTemplates[1];
            else if (rand >= 0.82) template = fishTemplates[2];

            const fromLeft = Math.random() < 0.5;
            const y = 40 + Math.random() * (canvas.height - 150);

            fishes.push({
                x: fromLeft ? -80 : canvas.width + 80,
                y: y,
                vx: fromLeft ? (template.isLuckBased ? 2.0 : 0.9) : (template.isLuckBased ? -2.0 : -0.9),
                isLuckBased: template.isLuckBased,
                baseKillChance: template.baseKillChance || 0,
                hp: template.hp || 0,
                maxHp: template.maxHp || 0,
                reward: template.reward,
                width: template.width,
                height: template.height,
                mainColor: template.mainColor,
                stripeColor: template.stripeColor,
                facingRight: fromLeft,
                tailAngle: 0
            });
        }
    }

    function addFloatingText(text, x, y, color = '#ffd700') {
        floatingTexts.push({ text: text, x: x, y: y, opacity: 1, color: color });
    }

    function update() {
        spawnFish();

        if (cannonRecoil > 0) cannonRecoil *= 0.8;

        bubbles.forEach(b => {
            b.y -= b.speed;
            b.x += Math.sin(b.y * b.swing) * 0.5;
            if (b.y < -10) {
                b.y = canvas.height + 10;
                b.x = Math.random() * canvas.width;
            }
        });

        bullets.forEach((b, bIdx) => {
            b.x += b.vx;
            b.y += b.vy;

            if (b.x < -20 || b.x > canvas.width + 20 || b.y < -20 || b.y > canvas.height + 20) {
                bullets.splice(bIdx, 1);
                return;
            }

            fishes.forEach((f, fIdx) => {
                if (Math.abs(b.x - f.x) < f.width / 1.5 && Math.abs(b.y - f.y) < f.height / 1.5) {
                    
                    for (let i = 0; i < 6; i++) {
                        particles.push({
                            x: b.x, y: b.y,
                            vx: (Math.random() - 0.5) * 6,
                            vy: (Math.random() - 0.5) * 6,
                            life: 12, color: b.color
                        });
                    }

                    let killed = false;

                    // --- نظام الحظ 20% ---
                    if (f.isLuckBased) {
                        // زيادة طفيفة للغاية عند اختيار طلقات أغلى
                        let luckMultiplier = b.price === 50 ? 1.4 : (b.price === 20 ? 1.2 : 1.0);
                        let finalChance = f.baseKillChance * luckMultiplier; // 20% تقريباً
                        
                        if (Math.random() < finalChance) {
                            killed = true;
                        } else {
                            addFloatingText(`هروب! ❌`, f.x, f.y - 10, '#ff4d4d');
                        }
                    } else {
                        // القرش الكبير
                        let damage = b.price === 50 ? 35 : (b.price === 20 ? 18 : 10);
                        f.hp -= damage;
                        if (f.hp <= 0) killed = true;
                    }

                    bullets.splice(bIdx, 1);

                    if (killed) {
                        gameBridge.credit('fishing', f.reward);
                        balance += f.reward;
                        document.getElementById('balanceText').innerText = balance;
                        addFloatingText(`+${f.reward} ريال 💰`, f.x, f.y, '#ffd700');
                        playKillSound();
                        fishes.splice(fIdx, 1);
                    }
                }
            });
        });

        fishes.forEach((f, idx) => {
            f.x += f.vx;
            f.tailAngle += 0.15;
            if (f.x < -120 || f.x > canvas.width + 120) fishes.splice(idx, 1);
        });

        particles.forEach((p, idx) => {
            p.x += p.vx; p.y += p.vy; p.life--;
            if (p.life <= 0) particles.splice(idx, 1);
        });

        floatingTexts.forEach((ft, idx) => {
            ft.y -= 1; ft.opacity -= 0.025;
            if (ft.opacity <= 0) floatingTexts.splice(idx, 1);
        });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let oceanGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        oceanGrad.addColorStop(0, '#0c2440');
        oceanGrad.addColorStop(0.4, '#061526');
        oceanGrad.addColorStop(1, '#020812');
        ctx.fillStyle = oceanGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#0a131d';
        ctx.fillRect(0, canvas.height - 25, canvas.width, 25);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
        bubbles.forEach(b => {
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
            ctx.fill();
        });

        fishes.forEach(f => {
            ctx.save();
            ctx.translate(f.x, f.y);
            if (!f.facingRight) ctx.scale(-1, 1);

            ctx.fillStyle = f.mainColor;
            ctx.save();
            ctx.translate(-f.width / 2.2, 0);
            ctx.rotate(Math.sin(f.tailAngle) * 0.25);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-18, -12);
            ctx.lineTo(-18, 12);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            ctx.beginPath();
            ctx.ellipse(0, 0, f.width / 2, f.height / 2, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = f.stripeColor;
            ctx.beginPath();
            ctx.ellipse(-2, 0, f.width / 6, f.height / 2.2, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(f.width / 3, -f.height / 6, 4.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(f.width / 3 + 1, -f.height / 6, 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            if (!f.isLuckBased) {
                const barW = f.width;
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(f.x - barW / 2, f.y - f.height / 1.5 - 10, barW, 4);
                ctx.fillStyle = '#00f0ff';
                ctx.fillRect(f.x - barW / 2, f.y - f.height / 1.5 - 10, barW * (f.hp / f.maxHp), 4);
            }
        });

        bullets.forEach(b => {
            ctx.fillStyle = b.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = b.color;
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        });

        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, 3, 3);
        });

        floatingTexts.forEach(ft => {
            ctx.fillStyle = ft.color || '#ffd700';
            ctx.font = 'bold 15px Segoe UI';
            ctx.fillText(ft.text, ft.x, ft.y);
        });

        ctx.save();
        ctx.translate(cannon.x, cannon.y);
        ctx.rotate(cannonAngle);

        const recoilX = -cannonRecoil;
        ctx.fillStyle = '#1e293b';
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 2;

        ctx.fillRect(recoilX, -10, 48, 8);
        ctx.fillRect(recoilX, 2, 48, 8);
        ctx.strokeRect(recoilX, -10, 48, 8);
        ctx.strokeRect(recoilX, 2, 48, 8);

        ctx.fillStyle = '#ffd700';
        ctx.fillRect(recoilX + 44, -12, 6, 24);

        ctx.restore();

        ctx.fillStyle = '#0f172a';
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(cannon.x, cannon.y + 12, 32, Math.PI, 0);
        ctx.fill();
        ctx.stroke();
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    gameLoop();

    gameBridge.ready().catch(()=>{});
</script>
