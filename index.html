<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول · WebChat</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="css/platform.css"><style>body{display:grid;place-items:center;min-height:100vh;padding:20px}.login{width:min(430px,100%);padding:34px;border-radius:28px;background:linear-gradient(145deg,#151e2e,#0e131d);border:1px solid #b98b3b66;box-shadow:0 25px 70px #0009}.login .brand{justify-content:center;margin-bottom:24px}.login h1{font-size:28px;margin:0 0 8px}.login p{color:var(--muted);font-size:13px;line-height:1.8}.field{margin:14px 0}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:7px}.field input{width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--line);background:#0b1018;color:var(--text);outline:0}.field input:focus{border-color:var(--gold)}.login .btn{margin-top:10px}.toggle{color:var(--gold);cursor:pointer}.error{min-height:20px;color:#fb7185;font-size:12px;margin-top:10px}</style></head><body><main class="login"><a class="brand" href="#"><span class="brand-mark">♛</span><b>WEBCHAT</b></a><span class="eyebrow">منصة الألعاب والتجمع الفخمة</span><h1 id="title">مرحبًا بعودتك</h1><p id="desc">سجّل دخولك للوصول إلى غرف اللعب وملفك الشخصي.</p><form id="auth-form"><div class="field" id="name-wrap" style="display:none"><label>اسم المستخدم</label><input id="name" autocomplete="name"></div><div class="field" id="gender-wrap" style="display:none"><label>الجنس</label><select id="gender" style="width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--line);background:#0b1018;color:var(--text)"><option value="male">ذكر</option><option value="female">أنثى</option></select></div><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" minlength="6" required></div><button class="btn gold full" id="submit" type="submit">دخول إلى المنصة <i class="fa-solid fa-arrow-left"></i></button></form><p id="switch">ليس لديك حساب؟ <span class="toggle" onclick="toggleMode()">إنشاء حساب جديد</span></p><button type="button" class="btn ghost full" onclick="forgotPassword()">هل نسيت كلمة المرور؟</button><div class="error" id="error"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/app.js"></script><script>let register=false;function toggleMode(){register=!register;document.getElementById('name-wrap').style.display=register?'block':'none';document.getElementById('gender-wrap').style.display=register?'block':'none';document.getElementById('title').textContent=register?'إنشاء حساب جديد':'مرحبًا بعودتك';document.getElementById('desc').textContent=register?'أنشئ حسابك الحقيقي واحفظ ملفك في قاعدة البيانات.':'سجّل دخولك للوصول إلى غرف اللعب وملفك الشخصي.';document.getElementById('submit').innerHTML=register?'إنشاء الحساب <i class="fa-solid fa-user-plus"></i>':'دخول إلى المنصة <i class="fa-solid fa-arrow-left"></i>';document.getElementById('switch').innerHTML=register?'لديك حساب؟ <span class="toggle" onclick="toggleMode()">تسجيل الدخول</span>':'ليس لديك حساب؟ <span class="toggle" onclick="toggleMode()">إنشاء حساب جديد</span>';document.getElementById('error').textContent='';}document.getElementById('auth-form').addEventListener('submit',async e=>{e.preventDefault();const err=document.getElementById('error'),btn=document.getElementById('submit');err.textContent='';btn.disabled=true;try{if(register)await signUp(document.getElementById('name').value.trim(),document.getElementById('email').value.trim(),document.getElementById('password').value,document.getElementById('gender').value);else await signIn(document.getElementById('email').value.trim(),document.getElementById('password').value);}catch(x){err.textContent=x.message.includes('Invalid login')?'البريد الإلكتروني أو كلمة المرور غير صحيحة.':x.message.includes('already registered')?'هذا البريد مسجل مسبقًا.':x.message;}finally{btn.disabled=false;}});async function forgotPassword(){const email=prompt('أدخل البريد الإلكتروني المرتبط بالحساب');if(!email?.trim())return;const err=document.getElementById('error');err.textContent='جارٍ إرسال طلب التحقق إلى المطور...';const sent=await window.supabaseClient.rpc('request_password_reset_code',{p_email:email.trim()});if(sent.error){err.textContent='تعذر إرسال الطلب: '+sent.error.message;return;}const code=prompt('تم إرسال الطلب. بعد أن يرسل المطور الرمز إلى بريدك، أدخل الرمز المكوّن من 6 أرقام');if(!/^[0-9]{6}$/.test(code||'')){err.textContent='أدخل رمزًا من 6 أرقام.';return;}const verified=await window.supabaseClient.rpc('verify_password_reset_code',{p_email:email.trim(),p_code:code.trim()});if(verified.error||!verified.data?.valid){err.textContent='رمز التحقق غير صحيح أو منتهي الصلاحية.';return;}const reset=await window.supabaseClient.auth.resetPasswordForEmail(email.trim(),{redirectTo:location.origin+'/index.html'});err.textContent=reset.error?'تعذر إرسال رابط إعادة التعيين: '+reset.error.message:'تم التحقق من الرمز. افتح رابط إعادة التعيين الذي سيصلك بالبريد.';}
window.supabaseClient.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')showResetForm();});function showResetForm(){document.querySelector('.login').innerHTML='<a class="brand" href="#"><span class="brand-mark">♛</span><b>WEBCHAT</b></a><span class="eyebrow">استعادة آمنة</span><h1>إنشاء كلمة مرور جديدة</h1><p>أدخل كلمة مرور جديدة لحسابك.</p><div class="field"><label>كلمة المرور الجديدة</label><input id="new-pass" type="password" minlength="6"></div><div class="field"><label>تأكيد كلمة المرور</label><input id="new-pass2" type="password" minlength="6"></div><button class="btn gold full" onclick="saveNewPassword()">حفظ كلمة المرور</button><div class="error" id="reset-error"></div>';}async function saveNewPassword(){const a=document.getElementById('new-pass').value,b=document.getElementById('new-pass2').value;if(a.length<6||a!==b){document.getElementById('reset-error').textContent='تأكد من تطابق كلمتي المرور وأن تكونا 6 أحرف على الأقل.';return;}const {error}=await window.supabaseClient.auth.updateUser({password:a});document.getElementById('reset-error').textContent=error?error.message:'تم تغيير كلمة المرور بنجاح. يمكنك تسجيل الدخول الآن.';if(!error)setTimeout(()=>window.supabaseClient.auth.signOut(),900);}</script></body></html>
